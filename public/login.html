<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="meta.login.title">دخول الموظفين</title>
  <meta name="description" content="" data-i18n-attr="content:meta.login.description">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#36454f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="data/settings.js"></script>
  <script src="js/boot.js"></script>
</head>
<!-- Employee sign-in: DEMO. The demo account is checked in js/portal.js (no server). The real sign-in comes in phase 2. -->
<body class="login-page" data-page="login">

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>

  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 1 10-10c0 2.2-1.8 3.5-4 3.5h-1.6a1.9 1.9 0 0 0-1.4 3.2c.4.4.6.9.6 1.4 0 1.1-.9 1.9-2 1.9z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15.5" cy="7.5" r="1.2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<a class="skip-link" href="#main" data-i18n="a11y.skip"></a>

<div class="demo-banner" data-demo-banner hidden>
  <span data-i18n="demo.banner"></span>
  <button class="theme-toggle" type="button" aria-expanded="false" aria-controls="theme-panel" data-theme-toggle>
    <svg class="icon" aria-hidden="true"><use href="#i-palette"/></svg><span data-i18n="theme.button"></span>
  </button>
</div>

<!-- Display options (demo): night mode, colour scheme, shape. Choices are applied at once and remembered on this device. -->
<div class="theme-backdrop" data-theme-backdrop hidden></div>
<div class="theme-panel" id="theme-panel" role="dialog" aria-labelledby="theme-title" data-theme-panel hidden>
  <div class="theme-panel-head">
    <h2 class="theme-title" id="theme-title" data-i18n="theme.title"></h2>
    <button class="theme-close" type="button" data-theme-close data-i18n-attr="aria-label:theme.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <fieldset class="theme-group">
    <legend data-i18n="theme.mode"></legend>
    <div class="theme-options">
      <label class="theme-opt"><input type="radio" name="theme-mode" value="light"><span><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span data-i18n="theme.light"></span></span></label>
      <label class="theme-opt"><input type="radio" name="theme-mode" value="dark"><span><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span data-i18n="theme.dark"></span></span></label>
    </div>
  </fieldset>
  <fieldset class="theme-group">
    <legend data-i18n="theme.colors"></legend>
    <div class="theme-options">
      <label class="theme-opt"><input type="radio" name="theme-accent" value="official"><span><i class="swatch swatch-official" aria-hidden="true"></i><span data-i18n="theme.official"></span></span></label>
      <label class="theme-opt"><input type="radio" name="theme-accent" value="navy"><span><i class="swatch swatch-navy" aria-hidden="true"></i><span data-i18n="theme.navy"></span></span></label>
      <label class="theme-opt"><input type="radio" name="theme-accent" value="burgundy"><span><i class="swatch swatch-burgundy" aria-hidden="true"></i><span data-i18n="theme.burgundy"></span></span></label>
    </div>
  </fieldset>
  <fieldset class="theme-group">
    <legend data-i18n="theme.shape"></legend>
    <div class="theme-options">
      <label class="theme-opt"><input type="radio" name="theme-shape" value="soft"><span><i class="shape-preview shape-soft" aria-hidden="true"></i><span data-i18n="theme.soft"></span></span></label>
      <label class="theme-opt"><input type="radio" name="theme-shape" value="sharp"><span><i class="shape-preview shape-sharp" aria-hidden="true"></i><span data-i18n="theme.sharp"></span></span></label>
      <label class="theme-opt"><input type="radio" name="theme-shape" value="round"><span><i class="shape-preview shape-round" aria-hidden="true"></i><span data-i18n="theme.round"></span></span></label>
    </div>
  </fieldset>
  <p class="theme-note" data-i18n="theme.note"></p>
  <button class="btn-text theme-reset" type="button" data-theme-reset data-i18n="theme.reset"></button>
</div>

<header class="site-header" data-header>
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <img class="brand-lockup" src="images/logo-ar.svg" alt="" width="171" height="40" data-logo="ar" data-i18n-attr="alt:brand.fullName">
      <img class="brand-lockup" src="images/logo-en.svg" alt="" width="171" height="40" data-logo="en" data-i18n-attr="alt:brand.fullName">
    </a>
    <div class="header-actions">
      <button class="lang-switch" type="button" data-lang-switch>
        <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>
        <span class="lang-full" data-i18n="header.langSwitch" data-i18n-attr="lang:header.langCode"></span>
        <span class="lang-short" data-i18n="header.langShort" data-i18n-attr="lang:header.langCode"></span>
      </button>
    </div>
  </div>
</header>

<main id="main" class="login-main">
  <div class="hero-pattern" aria-hidden="true"></div>
  <div class="login-card">
    <span class="login-icon" aria-hidden="true"><svg class="icon"><use href="#i-lock"/></svg></span>
    <h1 data-i18n="login.title"></h1>
    <p class="login-sub" data-i18n="login.subtitle"></p>
    <p class="login-notice"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span data-i18n="login.notice"></span></p>

    <form class="login-form" data-login-form novalidate>
      <fieldset>
        <div class="field">
          <label for="l-user" data-i18n="login.user"></label>
          <input class="input input-ltr" id="l-user" name="username" type="email" dir="ltr" autocomplete="username" required aria-describedby="l-error">
        </div>
        <div class="field">
          <label for="l-pass" data-i18n="login.password"></label>
          <div class="pass-wrap">
            <input class="input input-ltr" id="l-pass" name="password" type="password" dir="ltr" autocomplete="current-password" required aria-describedby="l-error">
            <button class="pass-toggle" type="button" data-show-pass aria-pressed="false" aria-controls="l-pass"><span data-i18n="login.show"></span></button>
          </div>
        </div>
        <p class="field-error login-error" id="l-error" data-login-error role="alert" hidden></p>
        <button class="btn btn-primary btn-lg btn-block" type="submit"><span data-i18n="login.submit"></span></button>
      </fieldset>
    </form>

    <a class="link-arrow" href="index.html">
      <svg class="icon icon-back" aria-hidden="true"><use href="#i-arrow"/></svg><span data-i18n="login.back"></span>
    </a>
  </div>
</main>

<noscript><p class="noscript">يرجى تفعيل JavaScript لعرض محتوى الموقع. · Please enable JavaScript to view this site.</p></noscript>

<script src="data/ar.js" defer></script>
<script src="data/en.js" defer></script>
<script src="data/portal-ar.js" defer></script>
<script src="data/portal-en.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/portal.js" defer></script>
</body>
</html>

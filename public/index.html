<!-- Display options (demo): night mode, colour scheme, shape. Choices are applied at once and remembered on this device. -->
<div class="theme-backdrop" data-theme-backdrop hidden></div>
<div class="theme-panel" id="theme-panel" role="dialog" aria-labelledby="theme-title" data-theme-panel hidden>
  <div class="theme-panel-head">
    <h2 class="theme-title" id="theme-title" data-i18n="theme.title"></h2>
    <button class="theme-close" type="button" data-theme-close data-i18n-attr="aria-label:theme.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <fieldset class="theme-group">
    <legend data-i18n="theme.mode"></legend>
    <div class="theme-options">
      <label class="theme-opt"><input type="radio" name="theme-mode" value="light"><span><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span data-i18n="theme.light"></span></span></label>
      <label class="theme-opt"><input type="radio" name="theme-mode" value="dark"><span><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span data-i18n="theme.dark"></span></span></label>
    </div>
  </fieldset>
  <fieldset class="theme-group">
    <legend data-i18n="theme.colors"></legend>
    <div class="theme-options">
      <label class="theme-opt"><input type="radio" name="theme-accent" value="official"><span><i class="swatch swatch-official" aria-hidden="true"></i><span data-i18n="theme.official"></span></span></label>
      <label class="theme-opt"><input type="radio" name="theme-accent" value="navy"><span><i class="swatch swatch-navy" aria-hidden="true"></i><span data-i18n="theme.navy"></span></span></label>
      <label class="theme-opt"><input type="radio" name="theme-accent" value="burgundy"><span><i class="swatch swatch-burgundy" aria-hidden="true"></i><span data-i18n="theme.burgundy"></span></span></label>
    </div>
  </fieldset>
  <fieldset class="theme-group">
    <legend data-i18n="theme.shape"></legend>
    <div class="theme-options">
      <label class="theme-opt"><input type="radio" name="theme-shape" value="soft"><span><i class="shape-preview shape-soft" aria-hidden="true"></i><span data-i18n="theme.soft"></span></span></label>
      <label class="theme-opt"><input type="radio" name="theme-shape" value="sharp"><span><i class="shape-preview shape-sharp" aria-hidden="true"></i><span data-i18n="theme.sharp"></span></span></label>
      <label class="theme-opt"><input type="radio" name="theme-shape" value="round"><span><i class="shape-preview shape-round" aria-hidden="true"></i><span data-i18n="theme.round"></span></span></label>
    </div>
  </fieldset>
  <p class="theme-note" data-i18n="theme.note"></p>
  <button class="btn-text theme-reset" type="button" data-theme-reset data-i18n="theme.reset"></button>
</div>

<!-- ============ Header ============ -->
<header class="site-header" data-header>
  <div class="container header-inner">
    <a class="brand" href="#home">
      <img class="brand-lockup" src="images/logo-ar.svg" alt="" width="171" height="40" data-logo="ar" data-i18n-attr="alt:brand.fullName">
      <img class="brand-lockup" src="images/logo-en.svg" alt="" width="171" height="40" data-logo="en" data-i18n-attr="alt:brand.fullName">
    </a>

    <nav class="main-nav" id="main-nav" data-nav data-i18n-attr="aria-label:nav.label">
      <ul class="nav-list">
        <li><a href="#home" data-i18n="nav.home"></a></li>
        <li><a href="#about" data-i18n="nav.about"></a></li>
        <li><a href="#team" data-i18n="nav.team"></a></li>
        <li><a href="#practice" data-i18n="nav.practice"></a></li>
        <li><a href="#contact" data-i18n="nav.contact"></a></li>
      </ul>
      <div class="nav-extra">
        <a class="btn btn-primary btn-block" href="#contact" data-book><span data-i18n="cta.book"></span></a>
        <a class="btn btn-outline-light btn-block" href="login.html"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span data-i18n="header.login"></span></a>
      </div>
    </nav>

    <div class="header-actions">
      <button class="lang-switch" type="button" data-lang-switch>
        <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>
        <span class="lang-full" data-i18n="header.langSwitch" data-i18n-attr="lang:header.langCode"></span>
        <span class="lang-short" data-i18n="header.langShort" data-i18n-attr="lang:header.langCode"></span>
      </button>
      <a class="btn btn-outline-accent btn-sm header-login" href="login.html">
        <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span data-i18n="header.login"></span>
      </a>
      <button class="menu-toggle" type="button" aria-controls="main-nav" aria-expanded="false" data-menu-toggle data-i18n-attr="aria-label:nav.open">
        <span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <!-- ============ 1. Home / Hero ============ -->
  <section class="hero" id="home" aria-labelledby="hero-title">
    <!-- the office photo: full background on phones, inside the arch on desktop (same file, downloaded once) -->
    <div class="hero-photo" aria-hidden="true"><img src="images/office/hero-office.jpg" alt="" width="720" height="1280" fetchpriority="high" decoding="async"></div>
    <div class="hero-pattern" aria-hidden="true"></div>
    <div class="container hero-inner">
      <div class="hero-content">
        <p class="eyebrow eyebrow-light"><span data-i18n="hero.eyebrow"></span></p>
        <h1 class="hero-title" id="hero-title">
          <span data-i18n="hero.title"></span>
          <span class="accent" data-i18n="hero.titleAccent"></span>
        </h1>
        <p class="hero-lead" data-i18n="hero.lead"></p>
        <div class="hero-cta">
          <a class="btn btn-primary btn-lg" href="#contact" data-book>
            <span data-i18n="cta.book"></span>
            <svg class="icon icon-flip" aria-hidden="true"><use href="#i-arrow"/></svg>
          </a>
          <a class="btn btn-outline-light btn-lg" href="#practice"><span data-i18n="hero.secondary"></span></a>
        </div>
        <ul class="hero-points" data-list="hero.points">
          <template><li><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span data-field="."></span></li></template>
        </ul>
      </div>

      <div class="hero-visual" aria-hidden="true">
        <div class="arch">
          <img class="arch-photo" src="images/office/hero-office.jpg" alt="" width="720" height="1280" decoding="async">
        </div>
        <div class="hero-badge">
          <strong class="hero-badge-num"><bdi data-years></bdi></strong>
          <span data-i18n="hero.badge"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Short intro + key numbers -->
  <section class="intro" aria-labelledby="intro-title">
    <div class="container intro-inner">
      <div class="intro-text reveal">
        <p class="eyebrow"><span data-i18n="intro.eyebrow"></span></p>
        <h2 class="section-title" id="intro-title" data-i18n="intro.title"></h2>
        <p data-i18n="intro.text"></p>
        <a class="link-arrow" href="#about"><span data-i18n="intro.more"></span><svg class="icon icon-flip" aria-hidden="true"><use href="#i-arrow"/></svg></a>
      </div>
      <ul class="stats reveal">
        <li class="stat"><span class="stat-num" data-stat="years"></span><span class="stat-label" data-i18n="stats.years"></span></li>
        <li class="stat"><span class="stat-num" data-stat="team"></span><span class="stat-label" data-i18n="stats.team"></span></li>
        <li class="stat"><span class="stat-num" data-stat="areas"></span><span class="stat-label" data-i18n="stats.areas"></span></li>
      </ul>
    </div>
  </section>

  <!-- ============ 2. About ============ -->
  <section class="section about" id="about" aria-labelledby="about-title">
    <div class="container">
      <div class="about-grid">
        <div class="about-media reveal">
          <img class="about-photo" src="images/office/desk-sea-view.jpg" alt="" width="720" height="1280" loading="lazy" decoding="async" data-i18n-attr="alt:about.photoAlt">
          <div class="exp-badge">
            <strong><bdi data-years></bdi></strong>
            <span data-i18n="about.badge"></span>
          </div>
        </div>
        <div class="about-body reveal">
          <p class="eyebrow"><span data-i18n="about.eyebrow"></span></p>
          <h2 class="section-title" id="about-title" data-i18n="about.title"></h2>
          <p class="lead" data-i18n="about.lead"></p>
          <p data-i18n="about.text"></p>
          <ul class="checklist" data-list="about.highlights">

      <div class="contact-grid">
        <!-- Demo form: nothing is sent yet (see js/main.js → setupForm) -->
        <form class="contact-form card reveal" novalidate data-contact-form>
          <h3 class="form-title" id="form-title" tabindex="-1" data-i18n="contact.form.title"></h3>
          <div class="form-grid">
            <div class="field">
              <label for="f-name"><span data-i18n="contact.form.name"></span> <span class="req" aria-hidden="true">*</span></label>
              <input class="input" id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="f-name-err" data-i18n-attr="placeholder:contact.form.namePh">
              <p class="field-error" id="f-name-err" hidden></p>
            </div>
            <div class="field">
              <label for="f-phone"><span data-i18n="contact.form.phone"></span> <span class="req" aria-hidden="true">*</span></label>
              <input class="input input-ltr" id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" required aria-describedby="f-phone-err" data-i18n-attr="placeholder:contact.form.phonePh">
              <p class="field-error" id="f-phone-err" hidden></p>
            </div>
            <div class="field">
              <label for="f-email"><span data-i18n="contact.form.email"></span> <span class="optional" data-i18n="contact.form.optional"></span></label>
              <input class="input input-ltr" id="f-email" name="email" type="email" autocomplete="email" dir="ltr" aria-describedby="f-email-err" data-i18n-attr="placeholder:contact.form.emailPh">
              <p class="field-error" id="f-email-err" hidden></p>
            </div>
            <div class="field">
              <label for="f-area"><span data-i18n="contact.form.area"></span> <span class="req" aria-hidden="true">*</span></label>
              <select class="input" id="f-area" name="area" required aria-describedby="f-area-err" data-area-select>
                <option value="" data-i18n="contact.form.areaPh"></option>
              </select>
              <p class="field-error" id="f-area-err" hidden></p>
            </div>
            <fieldset class="field field-full choice-group">
              <legend data-i18n="contact.form.method"></legend>
              <div class="choices">
                <label class="choice"><input type="radio" name="method" value="office" checked><span data-i18n="contact.form.methods.office"></span></label>
                <label class="choice"><input type="radio" name="method" value="phone"><span data-i18n="contact.form.methods.phone"></span></label>
                <label class="choice"><input type="radio" name="method" value="video"><span data-i18n="contact.form.methods.video"></span></label>
              </div>
            </fieldset>
            <div class="field field-full">
              <label for="f-message"><span data-i18n="contact.form.message"></span> <span class="req" aria-hidden="true">*</span></label>
              <textarea class="input" id="f-message" name="message" rows="5" required aria-describedby="f-message-err" data-i18n-attr="placeholder:contact.form.messagePh"></textarea>
              <p class="field-error" id="f-message-err" hidden></p>
            </div>
            <div class="field field-full">
              <label class="check">
                <input type="checkbox" id="f-consent" name="consent" required aria-describedby="f-consent-err">
                <span data-i18n="contact.form.consent"></span>
              </label>
              <p class="field-error" id="f-consent-err" hidden></p>
            </div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">
            <span data-i18n="contact.form.submit"></span>
            <svg class="icon icon-flip" aria-hidden="true"><use href="#i-arrow"/></svg>
          </button>
          <p class="form-note"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span><span data-i18n="contact.form.privacyNote"></span> <a href="legal.html#privacy" data-i18n="contact.form.privacyLink"></a></span></p>
          <p class="form-note"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span data-i18n="contact.form.note"></span></p>
          <div class="form-success" data-form-success tabindex="-1" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-check-circle"/></svg>
            <div>
              <h4 data-i18n="contact.form.successTitle"></h4>
              <p data-i18n="contact.form.successText"></p>
              <button class="btn-text" type="button" data-form-again data-i18n="contact.form.again"></button>
            </div>
          </div>
        </form>

        <aside class="contact-info reveal" aria-labelledby="info-title">
          <h3 class="info-heading" id="info-title" data-i18n="contact.info.title"></h3>
          <ul class="info-list">
            <li class="info-item">
              <span class="info-icon" aria-hidden="true"><svg class="icon"><use href="#i-phone"/></svg></span>
              <div>
                <p class="info-label" data-i18n="contact.info.phone"></p>

            <li class="info-item">
              <span class="info-icon info-icon-wa" aria-hidden="true"><svg class="icon"><use href="#i-whatsapp"/></svg></span>
              <div>
                <p class="info-label" data-i18n="contact.info.whatsapp"></p>

                  <svg class="icon" aria-hidden="true"><use href="#i-whatsapp"/></svg><span data-i18n="contact.info.whatsappAction"></span>
                </a>
              </div>
            </li>
            <li class="info-item">
              <span class="info-icon" aria-hidden="true"><svg class="icon"><use href="#i-mail"/></svg></span>
              <div>
                <p class="info-label" data-i18n="contact.info.email"></p>

              </div>
            </li>
            <li class="info-item">
              <span class="info-icon" aria-hidden="true"><svg class="icon"><use href="#i-pin"/></svg></span>
              <div>
                <p class="info-label" data-i18n="contact.info.address"></p>
                <p class="info-value" data-i18n="contact.address"></p>
              </div>
            </li>
            <li class="info-item">
              <span class="info-icon" aria-hidden="true"><svg class="icon"><use href="#i-clock"/></svg></span>
              <div class="info-grow">
                <p class="info-label" data-i18n="contact.info.hours"></p>
                <ul class="hours-list" data-list="contact.hours">

                </ul>
                <p class="hours-note" data-i18n="contact.hoursNote"></p>
              </div>
            </li>
          </ul>
        </aside>

      <!-- Location: map (placeholder until a Google Maps embed link is added in data/settings.js → mapEmbed) + office photos -->

          <figcaption data-i18n="contact.office.interior"></figcaption>
        </figure>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصفحة غير موجودة · Page not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#36454f">
  <!-- Cloudflare Pages shows this page for any address that doesn't exist, so links here start with "/" -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    /* follow the display options chosen on the site (night mode, colours, shape); language stays as it is */
    try {
      [['theme', 'theme-mode', ['dark']], ['accent', 'theme-accent', ['navy', 'green']], ['shape', 'theme-shape', ['sharp', 'round']]]
        .forEach(function (o) { var v = localStorage.getItem(o[1]); if (o[2].indexOf(v) > -1) document.documentElement.setAttribute('data-' + o[0], v); });
    } catch (e) {}
  </script>
</head>
<body class="login-page error-page">
  <main class="login-main">
    <div class="hero-pattern" aria-hidden="true"></div>
    <div class="login-card">
      <img src="/images/logo-mark-dark.svg" alt="" width="52" height="79" style="margin:0 auto 1rem">
      <h1>404</h1>
      <h2>الصفحة غير موجودة</h2>
      <p>عذرًا، لم نعثر على الصفحة التي تبحث عنها.</p>
      <h2 lang="en" dir="ltr">Page not found</h2>
      <p lang="en" dir="ltr">Sorry, we couldn't find the page you're looking for.</p>
      <div class="error-actions">
        <a class="btn btn-primary btn-block" href="/">العودة إلى الرئيسية</a>
        <a class="btn btn-navy btn-block" href="/?lang=en" lang="en">Back to home</a>
      </div>
    </div>
  </main>
</body>
</html>
